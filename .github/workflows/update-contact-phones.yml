name: Update Contact Phones

on:
  workflow_dispatch:
  # הרצה אוטומטית כשמעלים גרסה חדשה של קובץ האקסל
  push:
    paths:
      - 'data/פרטי_קשר_כל_המוסדות.xlsx'

permissions:
  contents: write

jobs:
  update-contact-phones:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install pandas openpyxl --quiet

      - name: 📞 Build contact-phones.json
        run: |
          python scripts/update_contact_phones.py "data/פרטי_קשר_כל_המוסדות.xlsx" "data/contact-phones.json"

      - name: 💾 Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contact-phones.json
          git diff --cached --quiet || git commit -m "🤖 auto: update contact-phones.json from Excel"
          git push || echo "⏭️ אין שינויים לשמור"

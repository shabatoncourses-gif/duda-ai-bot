name: עדכון מוסדות מ-Excel

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'הודעת commit (אופציונלי)'
        required: false
        default: '🔄 עדכון known_institutions מ-Excel'
  push:
    paths:
      # מתאים גם ל"מסד_דודא.xlsx" (קו תחתון) וגם ל"מסד דודא.xlsx" (רווח) וכל וריאציה דומה
      - 'data/מסד*דודא*.xlsx'

jobs:
  update-institutions:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: pip install pandas openpyxl

    - name: 🔄 הרצת update_institutions.py
      run: |
        # חיפוש גמיש של קובץ האקסל: "מסד_דודא.xlsx" או "מסד דודא.xlsx" (או וריאציה דומה).
        # אם יש כמה קבצים כאלה - נלקח המעודכן ביותר.
        EXCEL_FILE=$(ls -t data/מסד*דודא*.xlsx 2>/dev/null | head -n 1)
        if [ -n "$EXCEL_FILE" ]; then
          echo "📊 נמצא קובץ: $EXCEL_FILE"
          echo "📊 מריץ update_institutions.py..."
          python scripts/update_institutions.py \
            "$EXCEL_FILE" \
            "data/study-fields.json"
        else
          echo "❌ קובץ Excel לא נמצא בתיקיית data/ (חיפשתי מסד*דודא*.xlsx)"
          echo "📂 תוכן תיקיית data/:"
          ls -la data/ | grep -i xlsx || echo "  (לא נמצאו קבצי xlsx)"
          exit 1
        fi

    - name: 💾 שמירה ל-GitHub
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/study-fields.json
        if git diff --cached --quiet; then
          echo "⏭️ אין שינויים ב-study-fields.json"
        else
          MSG="${{ github.event.inputs.commit_message }}"
          [ -z "$MSG" ] && MSG="🔄 עדכון known_institutions מ-Excel"
          git commit -m "$MSG"
          # מגן מפני מרוץ מול commit מקביל שכבר התקדם ב-main בין ה-checkout
          # לבין ה-push (למשל הרצה אחרת שרצה במקביל) - מביא ומיישר מחדש לפני
          # הדחיפה, ומנסה שוב פעם אחת אם עדיין נדחה.
          git pull --rebase origin main
          git push || (git pull --rebase origin main && git push)
          echo "✅ study-fields.json עודכן ונשמר"
        fi

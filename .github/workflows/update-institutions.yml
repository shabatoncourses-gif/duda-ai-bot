name: עדכון מוסדות מ-Excel

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'הודעת commit (אופציונלי)'
        required: false
        default: '🔄 עדכון known_institutions מ-Excel'
  push:
    paths:
      - 'data/מסד_דודא.xlsx'

jobs:
  update-institutions:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: pip install pandas openpyxl

    - name: 🔄 הרצת update_institutions.py
      run: |
        if [ -f "data/מסד_דודא.xlsx" ]; then
          echo "📊 מריץ update_institutions.py..."
          python scripts/update_institutions.py \
            "data/מסד_דודא.xlsx" \
            "data/study-fields.json"
        else
          echo "❌ קובץ Excel לא נמצא: data/מסד_דודא.xlsx"
          exit 1
        fi

    - name: 💾 שמירה ל-GitHub
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/study-fields.json
        if git diff --cached --quiet; then
          echo "⏭️ אין שינויים ב-study-fields.json"
        else
          MSG="${{ github.event.inputs.commit_message }}"
          [ -z "$MSG" ] && MSG="🔄 עדכון known_institutions מ-Excel"
          git commit -m "$MSG"
          git push
          echo "✅ study-fields.json עודכן ונשמר"
        fi

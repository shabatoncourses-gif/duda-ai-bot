name: Build Index

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'איזה אתר לאנדקס?'
        required: true
        type: choice
        default: 'shabaton'
        options:
          - shabaton
          - morim
          - both
      reindex_mode:
        description: 'מה לאנדקס?'
        required: true
        type: choice
        default: 'dynamic-only'
        options:
          - dynamic-only
          - all-pages
          - fresh-start
      batch_size:
        description: 'Batch size (default: 40)'
        required: false
        default: '40'

jobs:
  build-index:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: Install Puppeteer dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 
            
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: 📦 Install dependencies
      run: |
        npm install cheerio openai dotenv
        sudo apt-get update && sudo apt-get install -y jq
    
    - name: 🎯 קביעת אתרים לעיבוד
      id: sites
      env:
        SITE_INPUT: ${{ github.event.inputs.site }}
      run: |
        if [ "$SITE_INPUT" = "both" ]; then
          echo "sites=shabaton morim" >> $GITHUB_OUTPUT
          echo "📋 יעבד: Shabaton + Morim"
        elif [ "$SITE_INPUT" = "shabaton" ]; then
          echo "sites=shabaton" >> $GITHUB_OUTPUT
          echo "📋 יעבד: Shabaton בלבד"
        elif [ "$SITE_INPUT" = "morim" ]; then
          echo "sites=morim" >> $GITHUB_OUTPUT
          echo "📋 יעבד: Morim בלבד"
        fi
    
    - name: 🏗️ בניית אינדקס - Shabaton
      if: contains(steps.sites.outputs.sites, 'shabaton')
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size }}
        REINDEX_MODE: ${{ github.event.inputs.reindex_mode }}
      run: |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🎓 מעבד: SHABATON"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        # בדיקת מצב נוכחי
        if [ -f "data/shabaton_done.json" ]; then
          DONE_COUNT=$(cat data/shabaton_done.json | jq '. | length')
          echo "📋 דפים ב-done.json: $DONE_COUNT"
          
          DYNAMIC_COUNT=$(cat data/shabaton_done.json | jq '[.[] | select(contains("results-") or contains("search-results-") or contains("courses-per-month-"))] | length')
          echo "🔄 דפים דינמיים: $DYNAMIC_COUNT"
        else
          echo "⏭️ אין קובץ done.json - זו הרצה ראשונה"
        fi
        
        # טיפול לפי מצב
        echo ""
        echo "🎯 מצב: $REINDEX_MODE"
        
        if [ "$REINDEX_MODE" = "fresh-start" ]; then
          echo "🧹 מחיקת כל קבצי המצב - התחלה מחדש"
          rm -f data/shabaton_done.json
          rm -f data/shabaton_failed.json
          rm -f data/shabaton_404.json
          echo "✅ נמחק הכל - מתחיל מאפס"
          
        elif [ "$REINDEX_MODE" = "all-pages" ]; then
          echo "🔄 אינדקס מחדש של כל הדפים"
          rm -f data/shabaton_done.json
          echo "✅ done.json נמחק - יעבד את כל הדפים מחדש"
          
        elif [ "$REINDEX_MODE" = "dynamic-only" ]; then
          if [ -f "data/shabaton_done.json" ]; then
            echo "🔍 מוחק רק דפים דינמיים..."
            
            cp data/shabaton_done.json data/shabaton_done.json.backup
            
            BEFORE=$(cat data/shabaton_done.json | jq '. | length')
            
            cat data/shabaton_done.json | jq '[.[] | select(
              (contains("results-") | not) and 
              (contains("search-results-") | not) and 
              (contains("courses-per-month-") | not)
            )]' > data/shabaton_done.json.tmp
            
            mv data/shabaton_done.json.tmp data/shabaton_done.json
            
            AFTER=$(cat data/shabaton_done.json | jq '. | length')
            REMOVED=$((BEFORE - AFTER))
            
            echo "✅ הושלם!"
            echo "   📊 דפים לפני: $BEFORE"
            echo "   📊 דפים אחרי: $AFTER"
            echo "   🗑️ נמחקו: $REMOVED דפים דינמיים"
          else
            echo "⏭️ אין קובץ done.json - זו הרצה ראשונה"
          fi
        fi
        
        echo ""
        echo "🚀 מתחיל אינדוקס..."
        node scripts/autoBuildIndex.js Shabaton https://www.shabaton.online/sitemap.xml
        
        echo ""
        echo "📊 סטטיסטיקות Shabaton:"
        if [ -f "data/shabaton_done.json" ]; then
          DONE=$(cat data/shabaton_done.json | jq '. | length')
          DYNAMIC=$(cat data/shabaton_done.json | jq '[.[] | select(contains("results-") or contains("search-results-") or contains("courses-per-month-"))] | length')
          echo "   ✅ דפים שעובדו: $DONE"
          echo "   🔄 מתוכם דינמיים: $DYNAMIC"
        fi
    
    - name: 🏗️ בניית אינדקס - Morim
      if: contains(steps.sites.outputs.sites, 'morim')
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size }}
        REINDEX_MODE: ${{ github.event.inputs.reindex_mode }}
      run: |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "👨‍🏫 מעבד: MORIM"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        # בדיקת מצב נוכחי
        if [ -f "data/morim_done.json" ]; then
          DONE_COUNT=$(cat data/morim_done.json | jq '. | length')
          echo "📋 דפים ב-done.json: $DONE_COUNT"
        else
          echo "⏭️ אין קובץ done.json - זו הרצה ראשונה"
        fi
        
        # ב-Morim אין דפים דינמיים, אז dynamic-only = לא עושים כלום
        echo ""
        echo "🎯 מצב: $REINDEX_MODE"
        
        if [ "$REINDEX_MODE" = "fresh-start" ]; then
          echo "🧹 מחיקת כל קבצי המצב - התחלה מחדש"
          rm -f data/morim_done.json
          rm -f data/morim_failed.json
          rm -f data/morim_404.json
          echo "✅ נמחק הכל - מתחיל מאפס"
          
        elif [ "$REINDEX_MODE" = "all-pages" ]; then
          echo "🔄 אינדקס מחדש של כל הדפים"
          rm -f data/morim_done.json
          echo "✅ done.json נמחק - יעבד את כל הדפים מחדש"
          
        elif [ "$REINDEX_MODE" = "dynamic-only" ]; then
          echo "ℹ️  Morim אין דפים דינמיים - מדלג"
          echo "💡 אם רוצה לעדכן Morim, בחר 'all-pages' או 'fresh-start'"
          exit 0
        fi
        
        echo ""
        echo "🚀 מתחיל אינדוקס..."
        node scripts/autoBuildIndex.js Morim https://www.morim.online/sitemap.xml
        
        echo ""
        echo "📊 סטטיסטיקות Morim:"
        if [ -f "data/morim_done.json" ]; then
          DONE=$(cat data/morim_done.json | jq '. | length')
          echo "   ✅ דפים שעובדו: $DONE"
        fi
    
    - name: 📊 סטטיסטיקות סופיות
      run: |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📈 סיכום כולל"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        # Shabaton
        if [ -f "data/shabaton_index.json" ]; then
          TOTAL=$(cat data/shabaton_index.json | jq '. | length')
          echo "🎓 Shabaton: $TOTAL דפים"
        fi
        
        # Morim
        if [ -f "data/morim_index.json" ]; then
          TOTAL=$(cat data/morim_index.json | jq '. | length')
          echo "👨‍🏫 Morim: $TOTAL דפים"
        fi
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    
    - name: 📤 Upload index artifacts
      uses: actions/upload-artifact@v4
      with:
        name: index-files-${{ github.run_number }}
        path: |
          data/*_index*.json
          data/*_done.json
          data/*_failed.json
          data/*_404.json
        retention-days: 30

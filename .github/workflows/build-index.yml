name: Build Index

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'אילו אתרים לעדכן?'
        required: true
        type: choice
        default: 'both'
        options:
          - shabaton
          - morim
          - both
      reindex_mode:
        description: 'מה לעדכן?'
        required: true
        type: choice
        default: 'dynamic-only'
        options:
         - dynamic-only
         - static-pages-only
         - institute-pages-only
         - all-pages
         - fresh-start
         - single-url
         - remove-url  # ⭐ חדש!
      single_url:
        description: 'URL של דף בודד (רק אם בחרת single-url)'
        required: false
        type: string
        default: ''
      batch_size:
        description: 'Batch size (default: 40)'
        required: false
        default: '40'

jobs:
  build-index:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: Install Puppeteer dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            fonts-liberation \
            libappindicator3-1 \
            xdg-utils \
            wget \
            ca-certificates

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install dependencies
      run: npm install

    - name: 🎯 בחירת אתרים
      id: sites
      run: |
        SITES="${{ github.event.inputs.sites }}"
        if [ "$SITES" = "shabaton" ]; then
          echo "sites=shabaton" >> $GITHUB_OUTPUT
        elif [ "$SITES" = "morim" ]; then
          echo "sites=morim" >> $GITHUB_OUTPUT
        else
          echo "sites=shabaton,morim" >> $GITHUB_OUTPUT
        fi

    # ========================================
    # 🎯 עדכון דף בודד - Shabaton
    # ========================================
    - name: 🎯 עדכון דף בודד - Shabaton
      if: |
        contains(steps.sites.outputs.sites, 'shabaton') && 
        github.event.inputs.reindex_mode == 'single-url'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size }}
      run: |
        SINGLE_URL="${{ github.event.inputs.single_url }}"
        
        if [ -z "$SINGLE_URL" ]; then
          echo "❌ שגיאה: לא סופק URL"
          exit 1
        fi
        
        echo "🎯 מעדכן דף בודד: $SINGLE_URL"
        node scripts/autoBuildIndex.js Shabaton "$SINGLE_URL"

     # ========================================
    # 🗑️ הסרת URL מהאינדקס - Shabaton
    # ========================================
    - name: 🗑️ הסרת URL - Shabaton
      if: |
        contains(steps.sites.outputs.sites, 'shabaton') && 
        github.event.inputs.reindex_mode == 'remove-url'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        SINGLE_URL="${{ github.event.inputs.single_url }}"
        
        if [ -z "$SINGLE_URL" ]; then
          echo "❌ שגיאה: לא סופק URL להסרה"
          exit 1
        fi
        
        echo "🗑️ מסיר URL: $SINGLE_URL"
        node -e "import('./scripts/autoBuildIndex.js').then(m => m.removeUrlFromIndex('Shabaton', '$SINGLE_URL'))"
        
    # ========================================
    # 📄 עדכון דפים סטטיים - Shabaton
    # ========================================
    - name: 📄 עדכון דפים סטטיים - Shabaton
      if: |
        contains(steps.sites.outputs.sites, 'shabaton') && 
        github.event.inputs.reindex_mode == 'static-pages-only'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        echo "📄 מעדכן רק דפים סטטיים של Shabaton..."
        node -e "import('./scripts/autoBuildIndex.js').then(m => m.updateStaticPages('Shabaton'))"

    # ========================================
    # 🏫 עדכון דפי מוסדות - Shabaton
    # ========================================
    - name: 🏫 עדכון דפי מוסדות - Shabaton
      if: |
        contains(steps.sites.outputs.sites, 'shabaton') && 
        github.event.inputs.reindex_mode == 'institute-pages-only'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        echo "🏫 מעדכן רק דפי מוסדות של Shabaton..."
        node -e "import('./scripts/autoBuildIndex.js').then(m => m.updateInstitutionPages('Shabaton', 'https://www.shabaton.online/sitemap.xml'))"

    # ========================================
    # 🔄 אינדוקס מלא - Shabaton
    # ========================================
    - name: 🔄 אינדוקס Shabaton
      if: |
        contains(steps.sites.outputs.sites, 'shabaton') && 
        github.event.inputs.reindex_mode != 'single-url' &&
        github.event.inputs.reindex_mode != 'remove-url' &&
        github.event.inputs.reindex_mode != 'static-pages-only' &&
        github.event.inputs.reindex_mode != 'institute-pages-only'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size }}
      run: |
        REINDEX_MODE="${{ github.event.inputs.reindex_mode }}"
        
        echo "מצב: $REINDEX_MODE"
        
        if [ "$REINDEX_MODE" = "fresh-start" ]; then
          echo "🔥 מתחיל מאפס - מוחק קבצי אינדקס"
          rm -f data/shabaton_index.json
          rm -f data/shabaton_done.json
          rm -f data/shabaton_index_part*.json
          echo "✅ כל הקבצים נמחקו - התחלה חדשה!"
          
        elif [ "$REINDEX_MODE" = "all-pages" ]; then
          echo "🔄 אינדקס מחדש של כל הדפים"
          rm -f data/shabaton_done.json
          echo "✅ done.json נמחק - יעבד את כל הדפים מחדש"
          
        elif [ "$REINDEX_MODE" = "dynamic-only" ]; then
          if [ -f "data/shabaton_done.json" ]; then
            echo "🔍 מוחק רק דפים דינמיים..."
            
            cp data/shabaton_done.json data/shabaton_done.json.backup
            
            BEFORE=$(cat data/shabaton_done.json | jq '. | length')
            
            cat data/shabaton_done.json | jq '[.[] | select(
              (contains("results-") | not) and 
              (contains("search-results-") | not) and 
              (contains("courses-per-month-") | not)
            )]' > data/shabaton_done.json.tmp
            
            mv data/shabaton_done.json.tmp data/shabaton_done.json
            
            AFTER=$(cat data/shabaton_done.json | jq '. | length')
            REMOVED=$((BEFORE - AFTER))
            
            echo "✅ הושלם!"
            echo "   📊 דפים לפני: $BEFORE"
            echo "   📊 דפים אחרי: $AFTER"
            echo "   🗑️ נמחקו: $REMOVED דפים דינמיים"
          else
            echo "⏭️ אין קובץ done.json - זו הרצה ראשונה"
          fi
        fi
        
        echo ""
        echo "🚀 מתחיל אינדוקס..."
        node scripts/autoBuildIndex.js Shabaton https://www.shabaton.online/sitemap.xml
        
        echo ""
        echo "📊 סטטיסטיקות Shabaton:"
        if [ -f "data/shabaton_done.json" ]; then
          DONE=$(cat data/shabaton_done.json | jq '. | length')
          DYNAMIC=$(cat data/shabaton_done.json | jq '[.[] | select(contains("results-") or contains("search-results-") or contains("courses-per-month-"))] | length')
          echo "   ✅ דפים שעובדו: $DONE"
          echo "   🔄 מתוכם דינמיים: $DYNAMIC"
        fi
    
    # ========================================
    # 🎯 עדכון דף בודד - Morim
    # ========================================
    - name: 🎯 עדכון דף בודד - Morim
      if: |
        contains(steps.sites.outputs.sites, 'morim') && 
        github.event.inputs.reindex_mode == 'single-url'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size }}
      run: |
        SINGLE_URL="${{ github.event.inputs.single_url }}"
        
        if [ -z "$SINGLE_URL" ]; then
          echo "❌ שגיאה: לא סופק URL"
          exit 1
        fi
        
        echo "🎯 מעדכן דף בודד: $SINGLE_URL"
        node scripts/autoBuildIndex.js Morim "$SINGLE_URL"

    # ========================================
    # 🗑️ הסרת URL מהאינדקס - Morim
    # ========================================
    - name: 🗑️ הסרת URL - Morim
      if: |
        contains(steps.sites.outputs.sites, 'morim') && 
        github.event.inputs.reindex_mode == 'remove-url'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        SINGLE_URL="${{ github.event.inputs.single_url }}"
        
        if [ -z "$SINGLE_URL" ]; then
          echo "❌ שגיאה: לא סופק URL להסרה"
          exit 1
        fi
        
        echo "🗑️ מסיר URL: $SINGLE_URL"
        node -e "import('./scripts/autoBuildIndex.js').then(m => m.removeUrlFromIndex('Morim', '$SINGLE_URL'))"
        
    # ========================================
    # 📄 עדכון דפים סטטיים - Morim
    # ========================================
    - name: 📄 עדכון דפים סטטיים - Morim
      if: |
        contains(steps.sites.outputs.sites, 'morim') && 
        github.event.inputs.reindex_mode == 'static-pages-only'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        echo "📄 מעדכן רק דפים סטטיים של Morim..."
        node -e "import('./scripts/autoBuildIndex.js').then(m => m.updateStaticPages('Morim'))"

    # ========================================
    # 🏫 עדכון דפי מוסדות - Morim
    # ========================================
    - name: 🏫 עדכון דפי מוסדות - Morim
      if: |
        contains(steps.sites.outputs.sites, 'morim') && 
        github.event.inputs.reindex_mode == 'institute-pages-only'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        echo "🏫 מעדכן רק דפי מוסדות של Morim..."
        node -e "import('./scripts/autoBuildIndex.js').then(m => m.updateInstitutionPages('Morim', 'https://www.morim.boutique/sitemap.xml'))"

    # ========================================
    # 🔄 אינדוקס מלא - Morim
    # ========================================
    - name: 🔄 אינדוקס Morim
      if: |
        contains(steps.sites.outputs.sites, 'shabaton') && 
        github.event.inputs.reindex_mode != 'single-url' &&
        github.event.inputs.reindex_mode != 'remove-url' &&
        github.event.inputs.reindex_mode != 'static-pages-only' &&
        github.event.inputs.reindex_mode != 'institute-pages-only'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size }}
      run: |
        REINDEX_MODE="${{ github.event.inputs.reindex_mode }}"
        
        echo "מצב: $REINDEX_MODE"
        
        if [ "$REINDEX_MODE" = "fresh-start" ]; then
          echo "🔥 מתחיל מאפס - מוחק קבצי אינדקס"
          rm -f data/morim_index.json
          rm -f data/morim_done.json
          rm -f data/morim_index_part*.json
          echo "✅ כל הקבצים נמחקו - התחלה חדשה!"
          
        elif [ "$REINDEX_MODE" = "all-pages" ]; then
          echo "🔄 אינדקס מחדש של כל הדפים"
          rm -f data/morim_done.json
          echo "✅ done.json נמחק - יעבד את כל הדפים מחדש"
          
        elif [ "$REINDEX_MODE" = "dynamic-only" ]; then
          if [ -f "data/morim_done.json" ]; then
            echo "🔍 מוחק רק דפים דינמיים..."
            
            cp data/morim_done.json data/morim_done.json.backup
            
            BEFORE=$(cat data/morim_done.json | jq '. | length')
            
            cat data/morim_done.json | jq '[.[] | select(
              (contains("results-") | not) and 
              (contains("search-results-") | not) and 
              (contains("courses-per-month-") | not)
            )]' > data/morim_done.json.tmp
            
            mv data/morim_done.json.tmp data/morim_done.json
            
            AFTER=$(cat data/morim_done.json | jq '. | length')
            REMOVED=$((BEFORE - AFTER))
            
            echo "✅ הושלם!"
            echo "   📊 דפים לפני: $BEFORE"
            echo "   📊 דפים אחרי: $AFTER"
            echo "   🗑️ נמחקו: $REMOVED דפים דינמיים"
          else
            echo "⏭️ אין קובץ done.json - זו הרצה ראשונה"
          fi
        fi
        
        echo ""
        echo "🚀 מתחיל אינדוקס..."
        node scripts/autoBuildIndex.js Morim https://www.morim.boutique/sitemap.xml
        
        echo ""
        echo "📊 סטטיסטיקות Morim:"
        if [ -f "data/morim_done.json" ]; then
          DONE=$(cat data/morim_done.json | jq '. | length')
          DYNAMIC=$(cat data/morim_done.json | jq '[.[] | select(contains("results-") or contains("search-results-") or contains("courses-per-month-"))] | length')
          echo "   ✅ דפים שעובדו: $DONE"
          echo "   🔄 מתוכם דינמיים: $DYNAMIC"
        fi

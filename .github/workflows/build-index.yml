name: Build Shabaton Index

on:
  workflow_dispatch:
    inputs:
      reindex_mode:
        description: 'מה לאנדקס?'
        required: true
        type: choice
        default: 'dynamic-only'
        options:
          - dynamic-only
          - all-pages
          - fresh-start
      batch_size:
        description: 'Batch size (default: 40)'
        required: false
        default: '40'
  
  schedule:
    - cron: '0 2 * * *'  # כל יום ב-2 בלילה

jobs:
  build-index:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: 📦 Install dependencies
      run: |
        npm install cheerio openai dotenv
        sudo apt-get update && sudo apt-get install -y jq
    
    - name: 📊 מצב נוכחי
      run: |
        if [ -f "data/shabaton_done.json" ]; then
          DONE_COUNT=$(cat data/shabaton_done.json | jq '. | length')
          echo "📋 דפים ב-done.json: $DONE_COUNT"
          
          DYNAMIC_COUNT=$(cat data/shabaton_done.json | jq '[.[] | select(contains("results-") or contains("search-results-") or contains("courses-per-month-"))] | length')
          echo "🔄 דפים דינמיים: $DYNAMIC_COUNT"
        else
          echo "⏭️ אין קובץ done.json - זו הרצה ראשונה"
        fi
    
    - name: 🗑️ טיפול בדפים לפי מצב
      env:
        REINDEX_MODE: ${{ github.event.inputs.reindex_mode || 'dynamic-only' }}
      run: |
        echo "🎯 מצב: $REINDEX_MODE"
        
        if [ "$REINDEX_MODE" = "fresh-start" ]; then
          echo "🧹 מחיקת כל קבצי המצב - התחלה מחדש"
          rm -f data/shabaton_done.json
          rm -f data/shabaton_failed.json
          rm -f data/shabaton_404.json
          echo "✅ נמחק הכל - מתחיל מאפס"
          
        elif [ "$REINDEX_MODE" = "all-pages" ]; then
          echo "🔄 אינדקס מחדש של כל הדפים"
          rm -f data/shabaton_done.json
          echo "✅ done.json נמחק - יעבד את כל הדפים מחדש"
          
        elif [ "$REINDEX_MODE" = "dynamic-only" ]; then
          if [ -f "data/shabaton_done.json" ]; then
            echo "🔍 מוחק רק דפים דינמיים..."
            
            # יצירת גיבוי
            cp data/shabaton_done.json data/shabaton_done.json.backup
            
            # ספירה לפני
            BEFORE=$(cat data/shabaton_done.json | jq '. | length')
            
            # מחיקת דפים דינמיים
            cat data/shabaton_done.json | jq '[.[] | select(
              (contains("results-") | not) and 
              (contains("search-results-") | not) and 
              (contains("courses-per-month-") | not)
            )]' > data/shabaton_done.json.tmp
            
            mv data/shabaton_done.json.tmp data/shabaton_done.json
            
            # ספירה אחרי
            AFTER=$(cat data/shabaton_done.json | jq '. | length')
            REMOVED=$((BEFORE - AFTER))
            
            echo "✅ הושלם!"
            echo "   📊 דפים לפני: $BEFORE"
            echo "   📊 דפים אחרי: $AFTER"
            echo "   🗑️ נמחקו: $REMOVED דפים דינמיים"
          else
            echo "⏭️ אין קובץ done.json - זו הרצה ראשונה"
          fi
        fi
    
    - name: 🏗️ בניית אינדקס
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size || '40' }}
      run: |
        node scripts/autoBuildIndex.js Shabaton https://www.shabaton.online/sitemap.xml
    
    - name: 📊 סטטיסטיקות סופיות
      run: |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📈 סטטיסטיקות אינדקס"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        if [ -f "data/shabaton_index.json" ]; then
          TOTAL=$(cat data/shabaton_index.json | jq '. | length')
          echo "📚 סה\"כ דפים באינדקס: $TOTAL"
        fi
        
        if [ -f "data/shabaton_done.json" ]; then
          DONE=$(cat data/shabaton_done.json | jq '. | length')
          DYNAMIC=$(cat data/shabaton_done.json | jq '[.[] | select(contains("results-") or contains("search-results-") or contains("courses-per-month-"))] | length')
          echo "✅ דפים שעובדו: $DONE"
          echo "🔄 מתוכם דינמיים: $DYNAMIC"
        fi
        
        if [ -f "data/shabaton_failed.json" ]; then
          FAILED=$(cat data/shabaton_failed.json | jq '. | length')
          echo "❌ דפים שנכשלו: $FAILED"
        fi
        
        if [ -f "data/shabaton_404.json" ]; then
          NOT_FOUND=$(cat data/shabaton_404.json | jq '. | length')
          echo "🔍 דפים לא נמצאו: $NOT_FOUND"
        fi
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    
    - name: 📤 Upload index artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shabaton-index-${{ github.run_number }}
        path: |
          data/shabaton_index*.json
          data/shabaton_done.json
          data/shabaton_failed.json
          data/shabaton_404.json
        retention-days: 30

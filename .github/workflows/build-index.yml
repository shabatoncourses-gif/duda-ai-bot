name: Build Shabaton Index

on:
  # הפעלה ידנית
  workflow_dispatch:
  
  # הפעלה אוטומטית כל יום ב-2 בלילה
  schedule:
    - cron: '0 2 * * *'
  
  # הפעלה על push למסלול main (אופציונלי)
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'scripts/autoBuildIndex.js'

jobs:
  build-index:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: 📦 Install dependencies
      run: |
        npm install cheerio openai dotenv
    
    - name: 🗑️ מחיקת דפים דינמיים מרשימת done
      run: |
        if [ -f "data/shabaton_done.json" ]; then
          echo "🔍 מוחק דפים דינמיים..."
          bash scripts/reindex_dynamic_pages.sh
        else
          echo "⏭️ אין קובץ done.json - זו הרצה ראשונה"
        fi
    
    - name: 🏗️ בניית אינדקס
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
        BATCH_SIZE: 40
      run: |
        node scripts/autoBuildIndex.js Shabaton https://www.shabaton.online/sitemap.xml
    
    - name: 📊 סטטיסטיקות
      run: |
        echo "📈 סטטיסטיקות אינדקס:"
        if [ -f "data/shabaton_index.json" ]; then
          TOTAL=$(cat data/shabaton_index.json | jq '. | length')
          echo "   סה\"כ דפים באינדקס: $TOTAL"
        fi
        
        if [ -f "data/shabaton_done.json" ]; then
          DONE=$(cat data/shabaton_done.json | jq '. | length')
          echo "   דפים שעובדו: $DONE"
        fi
    
    - name: 📤 Upload index artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shabaton-index
        path: |
          data/shabaton_index*.json
          data/shabaton_done.json
          data/shabaton_failed.json
          data/shabaton_404.json
        retention-days: 30

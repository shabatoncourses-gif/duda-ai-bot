name: 🧠 Auto Reindex Bot
permissions:
  contents: write
on:
  # מריץ פעם ביום בלילה (אפשר לשנות)
  schedule:
    - cron: "0 0 * * *"
  # מאפשר גם הרצה ידנית מה-GitHub UI
  workflow_dispatch:

jobs:
  reindex:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm install

      - name: ⚙️ Run full reindex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: "shabatoncourses-gif/duda-ai-bot"
          GITHUB_BRANCH: "main"
        - run: node scripts/autoBuildIndex.js --batch 50

      - name: ✅ Done!
        run: echo "🎉 Indexing finished successfully."


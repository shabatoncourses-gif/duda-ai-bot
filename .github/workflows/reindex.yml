name: Weekly Reindex via Vercel

on:
  schedule:
    # ריצה אוטומטית פעם בשבוע ביום ראשון בשעה 03:00 בבוקר (שעון ישראל)
    - cron: "0 1 * * 0"
  workflow_dispatch:  # מאפשר להריץ ידנית

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger reindex on Vercel
        run: |
          echo "🚀 קורא ל-API של Vercel כדי להריץ אינדוקס..."
          curl -X GET "https://duda-ai-bot.vercel.app/api/reindex" \
            -H "Accept: application/json" \
            -H "Cache-Control: no-cache" \
            -m 600

name: Auto Reindex Bot

on:
  # ▶️ כפתור ידני ב-GitHub → Actions → Run workflow
  workflow_dispatch:

  # ⏰ ריצה אוטומטית פעם בשבוע: יום ראשון 03:00 UTC
  schedule:
    - cron: "0 3 * * 0"

jobs:
  reindex:
    runs-on: ubuntu-latest

    steps:
      # 1) קלאסיקה – להביא את הקוד
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2) Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3) התקנת תלויות (אם יש package.json)
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      # 4) ליצור תיקיית data אם לא קיימת
      - name: Ensure data dir exists
        run: mkdir -p data

      # 5) להריץ את האינדוקס
      - name: Run autoBuildIndex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_CONTENT_TOKEN }}
          GITHUB_REPO: shabatoncourses-gif/duda-ai-bot
          GITHUB_BRANCH: main
        run: |
          node scripts/autoBuildIndex.js

      # 6) לראות לוג נעים בסוף
      - name: Done
        run: echo "✅ Reindex job finished"


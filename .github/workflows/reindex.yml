name: Auto Reindex Bot

on:
  # ✅ ריצה אוטומטית פעם בשבוע ביום ראשון ב-03:00 בלילה
  schedule:
    - cron: "0 3 * * 0"

  # ✅ ריצה ידנית לפי דרישה
  workflow_dispatch:

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # מאפשר עד 6 שעות ריצה

    steps:
      # 🔹 שלב 1: הורדת הקוד מהמאגר
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔹 שלב 2: התקנת Node.js (גרסה 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔹 שלב 3: התקנת תלויות
      - name: Install dependencies
        run: npm install

      # 🔹 שלב 4: הפעלת תהליך האינדוקס המלא
      - name: Run full indexing
        run: node scripts/autoBuildIndex.js

        # 🔑 הגדרת משתני סביבה לשימוש בסקריפט
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_CONTENT_TOKEN }}
          GITHUB_REPO: "shabatoncourses-gif/duda-ai-bot"
          GITHUB_BRANCH: "main"

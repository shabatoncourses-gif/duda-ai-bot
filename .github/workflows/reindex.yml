name: Weekly Reindex via Vercel

on:
  schedule:
    # ריצה אוטומטית פעם בשבוע ביום ראשון בשעה 03:00 בישראל
    - cron: "0 1 * * 0"
  workflow_dispatch:  # מאפשר להריץ ידנית

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger reindex on Vercel
        run: |
          echo "🚀 קורא ל-API של Vercel כדי להריץ אינדוקס..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "https://duda-ai-bot.vercel.app/api/reindex" -H "Accept: application/json" -H "Cache-Control: no-cache" -m 600)
          BODY=$(echo "$RESPONSE" | head -n 1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "🔍 תגובת שרת: $STATUS"
          echo "📄 פלט:"
          echo "$BODY"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ אינדוקס הופעל בהצלחה ב-Vercel!"
          else
            echo "❌ שגיאה בהפעלה! סטטוס: $STATUS"
            exit 1
          fi

name: Index Institution Pages

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'אילו אתרים לעדכן?'
        required: true
        type: choice
        default: 'both'
        options:
          - shabaton
          - morim
          - both

jobs:
  index-institutions:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: Install Puppeteer dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 fonts-liberation wget ca-certificates

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install dependencies
      run: npm install

    - name: 🏫 Index Shabaton Institutions
      if: contains(fromJSON('["shabaton","both"]'), github.event.inputs.sites)
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        echo "🏫 מאנדקס דפי מוסדות shabaton.online..."
        node scripts/autoBuildIndex.js Shabaton "https://www.shabaton.online/DYellin_Ma"
        node scripts/autoBuildIndex.js Shabaton "https://www.shabaton.online/akademon"

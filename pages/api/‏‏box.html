



<!-- 💬 בועת צ'אט חכמה - סוכן AI -->
<div id="ai-chatbot"></div>

<style>
  #chat-button {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background-color: #0078ff;
    color: white;
    border: none;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    z-index: 9999;
    transition: transform 0.2s;
  }
  #chat-button:hover {
    transform: scale(1.1);
  }
  #chat-box {
    position: fixed;
    bottom: 100px;
    right: 25px;
    width: 360px;
    max-height: 520px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    font-family: 'Assistant', sans-serif;
  }
  #chat-header {
    background-color: #0078ff;
    color: white;
    padding: 12px;
    font-weight: bold;
    text-align: center;
  }
  #chat-messages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    font-size: 15px;
  }
  .msg {
    margin: 8px 0;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .user {
    background-color: #0078ff;
    color: white;
    text-align: right;
    margin-left: 40px;
  }
  .bot {
    background-color: #f2f2f2;
    color: #222;
    text-align: left;
    margin-right: 40px;
  }
  .bot a {
    color: #0078ff;
    font-weight: bold;
    text-decoration: none;
  }
  #chat-input-area {
    display: flex;
    border-top: 1px solid #ddd;
  }
  #chat-input {
    flex: 1;
    border: none;
    padding: 10px;
    font-size: 14px;
    outline: none;
  }
  #send-btn {
    background-color: #0078ff;
    color: white;
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    transition: 0.2s;
  }
  #send-btn:hover {
    background-color: #005fd1;
  }
  #chat-box,
#chat-messages,
.msg {
  direction: rtl;
  text-align: right;
}

</style>

<button id="chat-button">💬</button>

<div id="chat-box">
  <div id="chat-header">סוכן AI 🤖</div>
  <div id="chat-messages">
    <div class="msg bot">שלום 👋<br>איך אפשר לעזור לך היום?</div>
  </div>
  <div id="chat-input-area">
    <input id="chat-input" type="text" placeholder="כתוב הודעה..." />
    <button id="send-btn">שלח</button>
  </div>
</div>

<script>
  const chatButton = document.getElementById("chat-button");
  const chatBox = document.getElementById("chat-box");
  const messages = document.getElementById("chat-messages");
  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("send-btn");

  chatButton.addEventListener("click", () => {
    chatBox.style.display = chatBox.style.display === "flex" ? "none" : "flex";
  });

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keypress", e => {
    if (e.key === "Enter") sendMessage();
  });

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    appendMessage(text, "user");
    input.value = "";

    appendMessage("⏳ מחפש תשובה...", "bot");

    try {
      const response = await fetch("https://duda-ai-bot.vercel.app/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      const data = await response.json();
      document.querySelectorAll(".bot").forEach(el => {
        if (el.innerText === "⏳ מחפש תשובה...") el.remove();
      });

      // תומך בתשובות הכוללות לינקים
      const formatted = data.reply
        .replace(/\n/g, "<br>")
        .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
      appendMessage(formatted, "bot");
    } catch (err) {
      appendMessage("❌ שגיאה בשליחת הבקשה.", "bot");
    }
  }

  function appendMessage(text, sender) {
    const msg = document.createElement("div");
    msg.classList.add("msg", sender);
    msg.innerHTML = text;
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
  }
</script>

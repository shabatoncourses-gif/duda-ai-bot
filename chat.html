<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שַׁבִּיבּוֹט — עוזר שבתון AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #0982bc; --blue-dark: #0770a3; --blue-light: #e8f4fb;
  --orange: #e8630a; --bg: #f0f6fb; --surface: #ffffff;
  --text: #1a2a3a; --text-muted: #6b7a8a; --border: #d4e6f4;
  --radius: 18px; --shadow: 0 4px 24px rgba(9,130,188,0.12);
  --font: 'Heebo', sans-serif;
}
html, body { height: 100%; margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); direction: rtl; }
.page { display: flex; flex-direction: column; height: 100%; max-width: 960px; margin: 0 auto; padding: 0 16px; }
.chat-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 14px; border-bottom: 2px solid var(--border); flex-shrink: 0; }
.header-brand { display: flex; align-items: center; gap: 14px; }
.header-avatar { width: 54px; height: 54px; background: linear-gradient(135deg, var(--blue) 0%, #0bb5e0 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 16px rgba(9,130,188,0.35); flex-shrink: 0; }
.header-text h1 { font-size: 22px; font-weight: 800; color: var(--blue); line-height: 1.1; }
.header-text p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.header-badge { background: var(--blue); color: white; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
.btn-icon { background: white; border: 1.5px solid var(--border); color: var(--text-muted); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; font-family: var(--font); transition: all 0.2s; }
.btn-icon:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
.input-zone { padding: 20px 0 12px; flex-shrink: 0; }
.input-wrapper { display: flex; align-items: center; gap: 10px; background: white; border: 2.5px solid var(--border); border-radius: 56px; padding: 8px 8px 8px 20px; box-shadow: var(--shadow); transition: border-color 0.25s, box-shadow 0.25s; }
.input-wrapper:focus-within { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(9,130,188,0.1), var(--shadow); }
#shabaton-chat-input { flex: 1; border: none; outline: none; font-size: 17px; font-family: var(--font); font-weight: 500; color: var(--text); background: transparent; direction: rtl; text-align: right; min-width: 0; }
#shabaton-chat-input::placeholder { color: #b0bec5; font-weight: 400; }
#shabaton-chat-send { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--orange) 0%, #f07e2a 100%); border: none; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(232,99,10,0.4); transition: all 0.2s; }
#shabaton-chat-send:hover:not(:disabled) { transform: scale(1.08); }
#shabaton-chat-send:disabled { opacity: 0.45; cursor: not-allowed; }
.suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 14px; flex-shrink: 0; }
.suggestion-chip { background: white; border: 1.5px solid var(--border); color: var(--blue); font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 20px; cursor: pointer; transition: all 0.2s; font-family: var(--font); }
.suggestion-chip:hover { background: var(--blue); color: white; border-color: var(--blue); }
.divider { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; flex-shrink: 0; }
.divider hr { flex: 1; border: none; border-top: 1.5px solid var(--border); }
.divider span { font-size: 12px; color: var(--text-muted); }
#shabaton-chat-messages { flex: 1; overflow-y: auto; padding: 0 0 12px; scroll-behavior: smooth; }
#shabaton-chat-messages::-webkit-scrollbar { width: 5px; }
#shabaton-chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.shabaton-message { margin-bottom: 16px; animation: fadeUp 0.3s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.shabaton-message-bot { display: flex; gap: 12px; align-items: flex-start; }
.shabaton-message-user { display: flex; justify-content: flex-start; }
.shabaton-bot-avatar { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--blue) 0%, #0bb5e0 100%); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.shabaton-message-content { background: white; padding: 14px 18px; border-radius: 4px 18px 18px 18px; max-width: 82%; box-shadow: 0 2px 8px rgba(0,0,0,0.07); line-height: 1.35; font-size: 15px; color: var(--text); direction: rtl; text-align: right; }
.shabaton-message-content h3 { font-size: 15px; font-weight: 700; margin: 6px 0 2px; }
.shabaton-message-content h3 a { color: var(--blue); text-decoration: underline; font-weight: 700; }
.shabaton-message-content p, .shabaton-message-content li { margin: 2px 0; line-height: 1.35; }
.shabaton-message-user .shabaton-message-content { background: var(--blue); color: white; border-radius: 18px 18px 4px 18px; font-weight: 500; }
.shabaton-typing { display: flex; gap: 5px; padding: 14px 18px; background: white; border-radius: 4px 18px 18px 18px; }
.shabaton-typing span { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); animation: typingBounce 1.2s ease-in-out infinite; display: inline-block; }
.shabaton-typing span:nth-child(2) { animation-delay: 0.2s; }
.shabaton-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce { 0%,60%,100% { transform:translateY(0); opacity:0.4; } 30% { transform:translateY(-10px); opacity:1; } }
.disclaimer { text-align: center; font-size: 11px; color: #b0bec5; padding: 10px 0 16px; flex-shrink: 0; }
.welcome-box { background: white; border-radius: var(--radius); padding: 28px 32px; box-shadow: var(--shadow); border: 1.5px solid var(--border); margin-bottom: 20px; }
.welcome-box p { font-size: 15px; line-height: 1.85; color: var(--text-muted); }
.welcome-box strong { color: var(--text); font-weight: 600; }
.welcome-box .example { color: #b0bec5; font-size: 13px; }
@media (min-width: 768px) { .page { padding: 0 32px; } .header-text h1 { font-size: 26px; } #shabaton-chat-input { font-size: 18px; } }
@media (max-width: 480px) { .header-text h1 { font-size: 19px; } .welcome-box { padding: 20px 18px; } #shabaton-chat-input { font-size: 16px; } }
</style>
</head>
<body>
<div class="page">
  <header class="chat-header">
    <div class="header-brand">
      <div class="header-avatar">🤖</div>
      <div class="header-text">
        <h1>שַׁבִּיבּוֹט</h1>
        <p>עוזר שבתון חכם — שאלו, וקבלו תשובה!</p>
      </div>
      <span class="header-badge">AI</span>
    </div>
    <div><button class="btn-icon" id="shabaton-clear-chat">🗑️ נקה</button></div>
  </header>
  <div class="input-zone">
    <div class="input-wrapper">
      <input type="text" id="shabaton-chat-input" placeholder="שאלו אותי על קורסים, שנת שבתון, מענקים..." autocomplete="off">
      <button id="shabaton-chat-send" disabled>➤</button>
    </div>
  </div>
  <div class="suggestions">
    <button class="suggestion-chip">קורסי טיולים</button>
    <button class="suggestion-chip">כמה מענק חודשי?</button>
    <button class="suggestion-chip">קורסי הדרכת הורים</button>
    <button class="suggestion-chip">ביטוח לאומי בשבתון</button>
    <button class="suggestion-chip">קורס הנחיית קבוצות</button>
  </div>
  <div class="divider"><hr><span>שיחה</span><hr></div>
  <div id="shabaton-chat-messages"></div>
  <div class="disclaimer">הצ'אט מבוסס AI ומספק מידע כללי בלבד. אין לראות בתשובות תחליף לייעוץ מקצועי.</div>
</div>
<script>
(function() {
  var CONFIG = {
    apiUrl: 'https://duda-ai-bot.vercel.app/api/ai_chat_v2',
    site: 'shabaton'
  };

  var messages  = document.getElementById('shabaton-chat-messages');
  var chatInput = document.getElementById('shabaton-chat-input');
  var chatSend  = document.getElementById('shabaton-chat-send');
  var clearBtn  = document.getElementById('shabaton-clear-chat');

  var isBusy = false, history = [];

  function renderMarkdown(text) {
    if (!text) return '';
    try {
      var links = [];

      // שמור קישורים [label](url)
      var t = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function(m, label, url) {
        links.push({ url: url, label: label });
        return '\x01' + (links.length - 1) + '\x01';
      });
      // המר **[קישור]** ל-h3 — index נפרד
      var h3Links = [];
      t = t.replace(/\*\*(\x01(\d+)\x01)\*\*/g, function(m, placeholder, idx) {
        var link = links[parseInt(idx)];
        if (!link) return m;
        h3Links.push(link); return '\x03' + (h3Links.length-1) + '\x03';
      });
      // URL גולמי
      t = t.replace(/(https?:\/\/[^\s<>"'\[\]]+)/g, function(m, url) {
        links.push({ url: url, label: url, isRaw: true });
        return '\x01' + (links.length - 1) + '\x01';
      });

      // escape HTML
      t = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      // כותרות ### — טפל לפני שחזור links
      // ### [שם](URL) יהפוך ל: <span class="shabaton-h3"><a>שם</a></span>
      t = t.replace(/^#{1,3}\s+(.+)$/mg, '<span class="shabaton-h3">$1</span>');

      // bold
      // **[קישור]** מטופל למעלה ישירות
      t = t.replace(/\*\*(.*?)\*\*/g, '<strong style="color:#0982bc;font-weight:700">$1</strong>');
      // כותרת דף מידע (אחרי 📋) - כחול
      t = t.replace(/📋 <strong style="color:#222">/g, '📋 <strong style="color:#0982bc;font-size:13.5px;display:block;margin:10px 0 0">');

      // הסר מספור ורשימות
      t = t.replace(/^\d+[.):]\s*/mg, '');
      t = t.replace(/^[-*]\s*/mg, '');

      // מפריד
      t = t.replace(/--+/g, '');

      // שורות
      t = t.replace(/\n/g, '<br>');

      // שחזר קישורים
      // h3 handled below after link restore
      var footerKw = ['כל קורסי', 'כל הקורסים', 'הרשם', 'קבוצת הוואטסאפ', 'עלון שבתון', 'אפשר לשאול', 'לשאול בקבוצת'];
      // הסר שורת רווח אחרי כותרת (H3 ו-bold כחול)
      t = t.replace(/(<span style="color:#0982bc[^"]*">[^<]*<\/span>)<br>/g, '$1 ');
      t = t.replace(/(<strong style="color:#0982bc[^"]*">[^<]*<\/strong>)<br>/g, '$1 ');

      t = t.replace(/\x01(\d+)\x01/g, function(m, i) {
        var link = links[parseInt(i, 10)];
        if (!link) return '';
        // קודד עברית ב-URL
        try {
          var urlObj = new URL(link.url);
          link.url = urlObj.href;
        } catch(e) {
          link.url = link.url.replace(/[\u0590-\u05FF\u05F0-\u05F4]/g, function(c){ try { return encodeURIComponent(c); } catch(e){ return c; } });
      // h3: ### ו-**[שם](url)** אחרי restore ואחרי bold
      t = t.replace(/^#{1,3}\s+(.+)$/mg, '<span class="shabaton-h3">$1</span>');
      // **<a>שם</a>** → כבר הפך ל-<strong><a>שם</a></strong> → h3
      t = t.replace(/^<strong[^>]*>(<a [^>]+>[^<]+<\/a>)<\/strong>/mg, '<span class="shabaton-h3">$1</span>');
      // גם **<a>** ישיר
      t = t.replace(/^\*\*(<a [^>]+>[^<]+<\/a>)\*\*/mg, '<span class="shabaton-h3">$1</span>');
      // <strong><a href="URL">שם</a></strong> → h3 (מגיע מ-**[שם](URL)**)
      t = t.replace(/<strong style="[^"]*">(<a [^>]+>[^<]+<\/a>)<\/strong>/g, function(m, a) {
        return '<span class="shabaton-h3">' + a + '</span>';
      });
        }

        if (link.isRaw) {
          return '<a href="' + link.url + '" target="_blank" style="color:#0982bc;font-weight:600;text-decoration:none">' + link.url + '</a>';
        }

        var ll = link.label.toLowerCase();
        var isFooter = footerKw.some(function(w){ return ll.indexOf(w.toLowerCase()) !== -1; });

        if (isFooter) {
          return '<span style="display:inline-flex;align-items:center;gap:3px;margin:2px 6px"><a href="' + link.url + '" target="_blank" style="color:#0982bc;font-weight:600;text-decoration:underline;white-space:nowrap">' + link.label + '</a></span>';
        }

        // כפתור — Claude קובע את הטקסט לפי הקשר
        // קבע טקסט כפתור לפי סוג הקישור
        // דפי מידע שבתון — לא מוסדות לימוד
        var infoSlugs = ['/important','/btl_shabaton','/shabaton-maanak','/Payments_shabaton',
          '/luz_shabaton','/end_shabaton','/forms_shabaton','/halforfull_shabaton',
          '/shabaton_request','/learning_programs_shabaton','/shabaton-hova-hashlama',
          '/birth_shabatgon','/shabaton_checklist','/change_prog_shabaton','/tlush_maanak_shabaton',
          '/halforfull','/maanak-shabaton','/hagdala','/shabaton-kabalot','/phones_shabaton',
          '/shabaton-plan','/shabaton-video','/back_from_shabaton','/shabaton_schedule',
          '/kabalot_shabaton','/tuition_reimbursement','/pension_shabaton',
          '/keren_makor_mishor','/tofes_101','/milgot-morim'];
        // footer links (כל קורסי, עלון, וואטסאפ) — כבר מטופלים למעלה כ-footerLink
        // כאן נטפל רק בכפתורים
        var isInfoPage = infoSlugs.some(function(p){ return link.url.indexOf(p) !== -1; });
        // קישורים שצריכים להיות טקסט רגיל (לא כפתור)
        var isPlainLink = ll.indexOf('פייסבוק') !== -1 || ll.indexOf('הצטרפ') !== -1;
        if (isPlainLink) {
          return '<a href="' + link.url + '" target="_blank" style="color:#0982bc;text-decoration:underline">' + link.label + '</a>';
        }
        var isResultsLink = link.url.indexOf('/results-') !== -1;
        // results-all/results-X = קישור קטגוריה = footer, לא כפתור
        if (isResultsLink) {
          return '<a href="' + link.url + '" target="_blank" style="color:#0982bc;font-weight:600;text-decoration:underline;">' + link.label + '</a>';
        }
        var btnText = isInfoPage ? 'לפירוט ולמידע נוסף' : 'פנו למידע ולייעוץ אישי';
        return '<a href="' + link.url + '" target="_blank" style="display:inline-block;background:#e8630a;color:white;text-decoration:none;padding:7px 18px;border-radius:8px;font-size:12.5px;font-weight:600;margin:6px 0 4px;box-shadow:0 2px 6px rgba(232,99,10,0.3)">' + btnText + '</a>';
      });

      return t;
    } catch(e) {
      return text.replace(/\n/g,'<br>');
    }
  }


    function addMessage(text, who) {
    var wrap = document.createElement('div');
    wrap.className = 'shabaton-message';
    if (who === 'bot') {
      wrap.innerHTML =
        '<div class="shabaton-message-bot">' +
        '<div class="shabaton-bot-avatar">&#129302;</div>' +
        '<div class="shabaton-message-content">' + renderMarkdown(text) + '</div>' +
        '</div>';
    } else {
      wrap.innerHTML =
        '<div class="shabaton-message-user">' +
        '<div class="shabaton-message-content">' +
        text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>') +
        '</div></div>';
    }
    // הוסף אחרי welcome, לפני שאר ההודעות
    var welcome = messages.querySelector('.shabaton-welcome-message, .welcome-box');
    var firstConv = messages.querySelector('.shabaton-message');
    if (firstConv) {
      messages.insertBefore(wrap, firstConv);
    } else if (welcome) {
      messages.insertBefore(wrap, welcome.nextSibling);
    } else {
      messages.prepend(wrap);
    }
    wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function addTyping() {
    var wrap = document.createElement('div');
    wrap.className = 'shabaton-message';
    wrap.innerHTML =
      '<div class="shabaton-message-bot">' +
      '<div class="shabaton-bot-avatar">&#129302;</div>' +
      '<div class="shabaton-typing">' +
      '<span></span>' +
      '<span></span>' +
      '<span></span>' +
      '</div></div>';
    // הוסף אחרי welcome, לפני שאר ההודעות
    var welcome = messages.querySelector('.shabaton-welcome-message, .welcome-box');
    var firstConv = messages.querySelector('.shabaton-message');
    if (firstConv) {
      messages.insertBefore(wrap, firstConv);
    } else if (welcome) {
      messages.insertBefore(wrap, welcome.nextSibling);
    } else {
      messages.prepend(wrap);
    }
    wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return wrap;
  }



    function scrollEnd(){
    setTimeout(function(){
      try { window.parent.postMessage({ iframeHeight: document.body.scrollHeight }, '*'); } catch(e){}
    }, 200);
  }



  function getWelcome() {
    return '<div class="welcome-box">' +
      '<p>ברוכים הבאים לשַׁבִּיבּוֹט 🤖 — העוזר הוירטואלי שלכם לשנת השבתון.<br>' +
      'כאן תמצאו <strong>קורסים מכל רחבי הארץ</strong>, תשובות על <strong>מענקים, ביטוח לאומי וטפסים</strong>,<br>' +
      'ומידע שיעזור לכם לתכנן שנה נפלאה.<br><br>' +
      'פשוט כתבו שאלה בתיבה למעלה — ואנחנו נענה!</p>' +
      '<p class="example" style="margin-top:12px">למשל: "קורסי טיולים", "כמה מקבלים במענק?", "הדרכת הורים בצפון"</p>' +
      '</div>';
  }

  messages.innerHTML = getWelcome();

  function sendMessage() {
    var msg = chatInput.value.trim();
    if (!msg || isBusy) return;
    chatInput.value = '';
    chatSend.disabled = true;
    addMessage(msg, 'user');
    history.push({ role: 'user', content: msg });
    var typingEl = addTyping();
    isBusy = true;

    fetch(CONFIG.apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ message: msg, history: history.slice(-6), site: CONFIG.site })
    })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d) {
      typingEl.remove();
      var reply = d.reply || 'מצטערים, אירעה שגיאה.';
      reply = reply.replace(/[\u1100-\u11FF\u3040-\u30FF\uAC00-\uD7AF]/g, '');
      reply = reply.replace(/^\s*--+\s*$/mg, '');
      reply = reply.replace(/^[A-Za-z][^\n]*\n/gm, '');
      reply = reply.replace(/(?<!\*)\*(?!\*)/g, '');
      reply = reply.replace(/^>\s?/mg, '');
      addMessage(reply, 'bot');
      history.push({ role: 'assistant', content: reply });
    })
    .catch(function(err) {
      typingEl.remove();
      console.error('[SHABI]', err);
      addMessage('מצטערים, יש תקלה. [קבוצת הוואטסאפ של שבתון](https://chat.whatsapp.com/FFak5hIoCHtKnPMEAwOlME)', 'bot');
    })
    .finally(function() { isBusy = false; });
  }

  chatSend.addEventListener('click', sendMessage);
  chatInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  chatInput.addEventListener('input', function() {
    chatSend.disabled = !chatInput.value.trim();
  });

  clearBtn.addEventListener('click', function() {
    history = [];
    messages.innerHTML = getWelcome();
  });

  // Suggestion chips
  document.querySelectorAll('.suggestion-chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      chatInput.value = chip.textContent.trim();
      chatSend.disabled = false;
      chatInput.focus();
      sendMessage();
    });
  });

})();
</script>
</body>
</html>
